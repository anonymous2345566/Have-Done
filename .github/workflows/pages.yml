name: Webversie (GitHub Pages)

# Publiceert de map src/ als website, zodat Klaar ook in de browser werkt.
# Eenmalig aanzetten: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Microsoft Client ID invullen (repo-variabele MS_CLIENT_ID)
        if: ${{ vars.MS_CLIENT_ID != '' }}
        shell: bash
        env:
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: |
          if [[ "$MS_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            sed -i.bak "s/msClientId: ''/msClientId: '$MS_CLIENT_ID'/" src/config.js && rm -f src/config.js.bak
            echo "Client ID ingevuld"
          else
            echo "::warning::MS_CLIENT_ID is geen geldige GUID en is overgeslagen"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
