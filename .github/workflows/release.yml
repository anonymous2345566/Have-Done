name: Release

# Maakt installers voor Windows, macOS en Linux en zet ze in een GitHub Release.
# Starten: push een tag zoals v1.0.0  (git tag v1.0.0 && git push --tags)
# Of handmatig via het tabblad Actions → Release → Run workflow (alleen build, geen release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Microsoft Client ID invullen (repo-variabele MS_CLIENT_ID)
        if: ${{ vars.MS_CLIENT_ID != '' }}
        shell: bash
        env:
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: |
          if [[ "$MS_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            sed -i.bak "s/msClientId: ''/msClientId: '$MS_CLIENT_ID'/" src/config.js && rm -f src/config.js.bak
            echo "Client ID ingevuld"
          else
            echo "::warning::MS_CLIENT_ID is geen geldige GUID en is overgeslagen"
          fi
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Version uit tag overnemen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installers
        run: npm run dist
        env:
          # geen code-signing certificaat nodig
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: klaar-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloaden
            | Systeem | Bestand |
            |---|---|
            | Windows (installer) | `Klaar-Setup-*.exe` |
            | Windows (zonder installatie) | `Klaar-Portable-*.exe` |
            | macOS (Apple Silicon) | `Klaar-*-arm64.dmg` |
            | macOS (Intel) | `Klaar-*-x64.dmg` |
            | Linux | `Klaar-*.AppImage` of `.deb` |

            De bestanden `latest*.yml` en `*.blockmap` zijn voor automatische updates; die hoef je niet te downloaden.

            Zie de README voor installatietips (Windows SmartScreen / macOS Gatekeeper).
